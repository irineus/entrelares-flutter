<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Entrelares — Play feature graphic generator (PT-BR)</title>
<!--
  T-38, redrawn for U-29/T-57 — generator for store/feature-graphic.png
  (Google Play feature graphic, 1024x500). The English sibling is
  feature-graphic-english.html.

  IDENTITY (U-29, 26/08/2026): the mark is the calendar card whose day cells
  draw the two interlocked houses, on the brand indigo #4F46E5. It is DRAWN,
  not generated — store/brand-icons.py is its source, and this file simply
  shows the icon that script writes (store_icon.png, 512²), so the graphic can
  never drift from the launcher. The clay emblem this file used to frame
  (brand-emblema.png, F-54) was retired by U-29 and is not referenced here any
  more.

  PALETTE: every colour below is a token from
  apps/entrelares_app/lib/theme/tokens.dart — surface #F9FAFB, text #111827,
  textMuted #6B7280, accent.solid #4F46E5, accent.container #EEF2FF,
  swapped.container #FEF3C7. The cream/navy of the clay era is gone with it.

  NOT served: this file lives in store/, next to the other listing assets.

  Render with headless Chrome at 1024x500:

    chrome --headless --disable-gpu --hide-scrollbars \
           --screenshot=store/feature-graphic.png --window-size=1024,500 \
           store/feature-graphic.html

  NOTE: some headless builds subtract window chrome from --window-size (the viewport
  comes out ~87px shorter than asked). If the output shows a white band, render with
  a LARGER window and crop the top-left corner:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --screenshot=shot.png --window-size=1124,650 store/feature-graphic.html
    python3 -c "from PIL import Image; Image.open('shot.png').crop((0,0,1024,500))\
    .convert('RGB').save('store/feature-graphic.png', optimize=True)"

  Upload at Play Console -> Store presence -> Main store listing -> Feature graphic;
  Play serves its own copy, nothing updates it automatically.

  Re-render whenever the tagline or the mark changes — and re-run brand-icons.py
  FIRST, because the plaque below is that script's output.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Liberation Sans", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    background-image:
      radial-gradient(680px 440px at 94% 0%, rgba(79, 70, 229, 0.12) 0%, rgba(79, 70, 229, 0) 60%),
      radial-gradient(600px 420px at 2% 100%, rgba(217, 119, 6, 0.12) 0%, rgba(217, 119, 6, 0) 58%);
    color: #111827;
    position: relative;
  }
  /* Fixed positions, not flex: font metrics differ per platform (Segoe UI on
     Windows, DejaVu on Linux) and a metric-dependent layout can overflow. */
  /* the mark, as the launcher ships it: store_icon.png, shown 1:1 */
  .art {
    position: absolute; top: 72px; left: 58px;
    width: 356px; height: 356px;
    border-radius: 84px; overflow: hidden;   /* Android's own squircle radius */
    box-shadow: 0 12px 32px rgba(17, 24, 39, 0.16);
    background: url(store_icon.png) no-repeat #4f46e5;
    background-size: 100% 100%;
  }

  .copy { position: absolute; top: 118px; left: 462px; right: 44px; }
  .name { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
  h1 { font-size: 42px; font-weight: 800; line-height: 1.16; letter-spacing: -0.02em; margin-bottom: 20px; }
  .sub { font-size: 24px; line-height: 1.35; color: #6b7280; font-weight: 600; }
</style>
</head>
<body>

<div class="art"></div>

<div class="copy">
  <div class="name">Entrelares</div>
  <h1>Duas casas,<br />uma mesma infância.</h1>
  <p class="sub">Calendário de convivência para pais separados</p>
</div>

</body>
</html>

name: entrelares_app
description: "Entrelares — Flutter app (T-53 stage-1 spike: month calendar + day sheet against the real dev backend)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# versionName / versionCode. Bump on every functional change handed to the
# owner, same rule as the product repos.
version: 0.2.28+30

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # U-13 port: Material's own strings (dialogs, a11y labels) follow the
  # session language; the app catalog stays in entrelares_core.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Lote 1 shell: URL-based routing so Android App Links land on the right
  # screen (recovery is the first consumer; invitations follow in lote 4).
  go_router: ^16.2.0
  # U-13 port: the persisted language override (the web's localStorage
  # equivalent) — read at boot, before any session exists.
  shared_preferences: ^2.5.3
  # Same major the console pilot and the Desmalha benchmark pin — GoTrue auth,
  # PostgREST and NATIVE Realtime (the F-29 JS bridge retires here).
  supabase_flutter: ^2.17.2
  # Legal pages stay on the web until lote 4 — opened in the browser (the
  # stores accept external legal links; parity map, lote 4).
  url_launcher: ^6.3.1
  # Lote 4 — the native improvement the parity map asks for twice: the system
  # share sheet replaces the web's "copy the link and send it on WhatsApp" hint
  # (invitations) and the browser download (LGPD export, PR 4).
  share_plus: ^10.1.4
  # F-17 export: the share sheet hands over a FILE, so the JSON is written to
  # the app's own cache directory first (never external storage — no extra
  # permission, and the OS reclaims it).
  path_provider: ^2.1.5
  # F-33 redesign: the browser's print() does not exist in a native app, so the
  # report is a REAL PDF built on the device. `pdf` composes the document (pure
  # Dart — the composition is unit-testable without a device) and `printing`
  # hands it to the system share sheet or the native print dialog.
  pdf: ^3.13.0
  printing: ^5.15.0
  # T-48 (lote 5): Play Billing. A native app may NOT sell a digital
  # subscription through an external checkout — Play requires its own billing,
  # and the Digital Goods API the original T-48 described was a Chrome/TWA
  # mechanism that does not exist here. The plugin is wrapped behind an
  # interface so the Premium section is testable without a store.
  in_app_purchase: ^3.2.3
  # Pure client mirrors of the server rules, tested with `dart test`.
  entrelares_core:
    path: ../../packages/entrelares_core
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # T-53 lote 3 — the E2E lane the parity map opens with the first two-user
  # flow (the swap workflow). `integration_test` drives the REAL app on a real
  # emulator against the dev project; the throwaway-family pattern is the same
  # one the web suite pays for (`E2E-<runId>`, `@resend.dev`, purge_e2e_family).
  integration_test:
    sdk: flutter
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # F-33: the fonts the generated PDF embeds. dart_pdf's built-in Helvetica has
  # NO Unicode support — it silently DROPS accents ("Relatório" printed as
  # "Relatrio") and refuses the em dash, which would ship a mangled Portuguese
  # document. Roboto (Apache-2.0, vendored from the Flutter SDK's own material
  # fonts with its license alongside) is embedded in every report instead. They
  # are declared as ASSETS, not as a Flutter font family: only the PDF reads
  # them, as raw bytes.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

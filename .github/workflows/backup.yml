# =============================================================================
# T-19 — Automated WEEKLY database backup to Cloudflare R2 (enabled).
#
# Every Monday 04:37 UTC (01:37 in São Paulo) this dumps the PRODUCTION
# database — row data + auth users — encrypts it (GPG symmetric, AES-256) and
# uploads the encrypted file to a private Cloudflare R2 bucket. The plaintext
# never leaves the runner. Two layers protect the personal data: the R2 bucket
# is private + encrypted at rest, AND the file itself is GPG-encrypted, so even
# a leaked R2 token cannot expose the data without the passphrase.
#
# MOVED HERE on 24/08/2026 from `entrelares-app`, which is being archived
# (`docs/arquivamento-app.md`). Archiving a repository turns its scheduled
# workflows OFF, so leaving the weekly backup of the PRODUCTION database behind
# would have killed it the day the old repo was retired — which is exactly the
# kind of thing nobody notices until a restore is needed.
#
# NOTE ON ACTIVATION: GitHub only runs scheduled/manual workflows from the
# DEFAULT branch, and here that is `main` — so this is live as soon as it merges,
# with no promotion in between (in the app repo it needed one).
#
# THE HANDOVER IS THE SECRETS, NOT THE FILE. Until they exist here, this run
# SKIPS with a note instead of failing (the app repo is still backing up). Once
# you set them here, disable the old workflow at the source — `gh workflow
# disable backup.yml -R irineus/entrelares-app` — which needs no code change and
# no promotion. Do NOT simply delete the secrets there: that copy FAILS on
# missing secrets by design, so it would go red every Monday instead of stopping.
# Two live copies would take two backups of the same database every week.
#
# ── ONE-TIME SETUP ───────────────────────────────────────────────────────────
# 1. Cloudflare dashboard → R2 → Create bucket → name it `guarda-backups`
#    (or change R2_BUCKET below).
# 2. R2 → Manage R2 API Tokens → Create API token → Object Read & Write,
#    scoped to that bucket. Copy the Access Key ID, Secret Access Key, and your
#    Cloudflare Account ID (shown on the R2 overview page).
# 3. GitHub repo → Settings → Secrets and variables → Actions → add secrets:
#      BACKUP_PASSPHRASE      — a strong passphrase you keep OFFLINE (encryption key)
#      R2_ACCOUNT_ID          — Cloudflare account id (for the endpoint URL)
#      R2_ACCESS_KEY_ID       — R2 token access key id
#      R2_SECRET_ACCESS_KEY   — R2 token secret access key
#    Plus the three SUPABASE_*_PROD secrets (the `db-prod` job of verify.yml
#    uses the same ones). ALL of them must be set together — see the handover
#    note above: half-configured fails on purpose.
#
# ── TEST ─────────────────────────────────────────────────────────────────────
#   After it is on main + secrets set: Actions → "Weekly encrypted backup"
#   → Run workflow. Then check the object in the R2 bucket.
#
# ── RESTORE (needs GnuPG + the AWS CLI or the R2 dashboard) ───────────────────
#   Download backup_YYYY-MM-DD.sql.gpg from the bucket, then:
#     gpg --batch --pinentry-mode loopback --passphrase "<BACKUP_PASSPHRASE>" \
#         -o backup.sql -d backup_YYYY-MM-DD.sql.gpg
#     psql "<PROD_DATABASE_URL>" -f backup.sql   # auth section loads before public
# =============================================================================
name: Weekly encrypted backup

on:
  schedule:
    # Minute 37 (not :00) on purpose: GitHub's scheduler heavily contends the
    # top of every hour and drops/delays scheduled runs there — the first
    # scheduled run (2026-07-27 04:00 UTC) was skipped entirely. An off-peak
    # minute is GitHub's own documented mitigation.
    - cron: "37 4 * * 1"   # Mondays 04:37 UTC (01:37 America/Sao_Paulo)
  workflow_dispatch:       # manual run (Actions → Run workflow) to test on demand

permissions:
  contents: read

env:
  R2_BUCKET: guarda-backups

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Three states, not two. "None present" means the handover from
      # `entrelares-app` has not happened and that repo is still taking the
      # backup — skipping is CORRECT and must not paint the schedule red. "All
      # present" runs. "Some present" is the dangerous one: a half-configured
      # backup looks armed and produces nothing, so it fails loudly.
      - name: Verificar os segredos necessários
        id: secrets
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_ACCESS_TOKEN_PROD: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
        run: |
          missing=""; present=""
          for name in BACKUP_PASSPHRASE R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY SUPABASE_ACCESS_TOKEN_PROD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else present="$present $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$present" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "### Backup PULADO — os segredos ainda não estão neste repo" >> "$GITHUB_STEP_SUMMARY"
            echo "Quem faz o backup semanal continua sendo o \`entrelares-app\`. Ver a nota de handover no topo deste arquivo." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Configuração PELA METADE — presentes:$present / ausentes:$missing. Um backup meio configurado não produz backup nenhum."
            exit 1
          fi

      - name: Install Supabase CLI
        if: steps.secrets.outputs.armed == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Dump + encrypt (row data + auth users)
        if: steps.secrets.outputs.armed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"

          STAMP=$(date -u +%Y-%m-%d)
          # Auth users first so a restore can load them before public.* (FK order).
          supabase db dump --linked --schema auth --data-only -f "auth_${STAMP}.sql"
          supabase db dump --linked --data-only -f "data_${STAMP}.sql"
          cat "auth_${STAMP}.sql" "data_${STAMP}.sql" > "backup_${STAMP}.sql"

          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "backup_${STAMP}.sql.gpg" "backup_${STAMP}.sql"
          rm -f "auth_${STAMP}.sql" "data_${STAMP}.sql" "backup_${STAMP}.sql"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        if: steps.secrets.outputs.armed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # R2 is S3-compatible; the AWS CLI is preinstalled on the runner.
          aws s3 cp "backup_${STAMP}.sql.gpg" \
            "s3://${R2_BUCKET}/backups/backup_${STAMP}.sql.gpg" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Backup enviado: s3://${R2_BUCKET}/backups/backup_${STAMP}.sql.gpg"

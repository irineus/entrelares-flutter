# T-54 — the repo's gate: analyze + tests on every push/PR.
# T-53 stage 4 added the `deploy-web` job at the bottom: the web channel is
# PUBLISHED from here, and only behind a green gate — nothing reaches a user that
# the suites have not seen. Since 24/08/2026 that gate is TWO jobs: `verify` (the
# Flutter suites) and `db-gate` (the 221 database tests that moved here from
# `entrelares-app`), and `deploy-web` waits on both.
# The APK build and the E2E emulator lane stay OUT of the gate on purpose: both
# are minutes-expensive and the account's 2000 min/mo are shared with the
# product repos (same constraint that shaped T-50). The E2E lane runs daily on
# a schedule and on demand; an APK comes from workflow_dispatch.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  # T-53 lote 3: the E2E lane runs on a schedule, not on every push — an
  # emulator run costs ~10-15 min of the account-wide 2000 min/mo (the same
  # constraint that keeps the APK build out of the gate). 06:10 UTC daily.
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      build-apk:
        description: "Also build the debug APK (arm64, split-per-abi)"
        type: boolean
        default: false
      run-e2e:
        description: "Also run the E2E lane on an emulator (two-user swap flow)"
        type: boolean
        default: false
      run-web-e2e:
        description: "Run the SPIKE: the same integration_test files in a headless browser"
        type: boolean
        default: false
      e2e-pack:
        description: "E2E pack: p0 (smoke) or full"
        type: choice
        options: [p0, full]
        default: p0

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .fvmrc is the single source of truth for the Flutter version (locked
      # decision: version changes only by explicit owner decision on the board).
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Core — analyze + dart test
        working-directory: packages/entrelares_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: App — analyze + flutter test
        working-directory: apps/entrelares_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # T-53 lote 6, tension 1 (owner, 19/08/2026): Flutter Web REPLACES the
      # PWA, so the web target is part of the gate — a build that only compiles
      # for Android would let the web channel rot silently. It is a compile, not
      # an emulator: ~1,5 min, cheap enough for every push.
      - name: Web — release build + first-load weight
        working-directory: apps/entrelares_app
        run: |
          flutter build web --release --no-web-resources-cdn
          echo "### Web first-load weight (gzip)" >> "$GITHUB_STEP_SUMMARY"
          for f in build/web/flutter_bootstrap.js build/web/main.dart.js build/web/canvaskit/canvaskit.wasm; do
            if [ -f "$f" ]; then
              kb=$(( $(gzip -c "$f" | wc -c) / 1024 ))
              echo "- $(basename "$f"): ${kb} KB" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # This is NOT the channel-acceptance number — that one was measured
          # on a real mid-range Android over 4G, against the PWA, and granted
          # by the owner on 23/08/2026. What this step keeps doing is guarding
          # it: the weight that drives the first load stays visible on every
          # push, so a regression is noticed the day it lands rather than the
          # day someone complains.

  # ── The DB gate ──────────────────────────────────────────────────────────
  # 221 tests over RLS, the SECURITY DEFINER RPCs, the triggers and the billing
  # ledger, run against the REAL dev project with a throwaway family. It is the
  # test layer that proves the invariant this product is built on — the client
  # MIRRORS, the database ENFORCES — and it moved here from `entrelares-app`,
  # which is being archived (`docs/arquivamento-app.md`).
  #
  # It is still C#, and deliberately so: the suite only ever needed the Blazor
  # client for its PostgREST models, so lifting those into `Entrelares.DbContracts`
  # moved 221 tests without rewriting a line of them. The decision on record is to
  # PORT it to Dart suite by suite; carrying it intact first is what keeps the gate
  # covered while that happens, instead of trading a working gate for a migration.
  #
  # Runs on the same events as `verify` (and blocks `deploy-web` alongside it), but
  # in its own job: it needs .NET rather than Flutter, so it costs nothing to run
  # them side by side.
  db-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialized across the whole repo, unlike the per-ref group of the workflow.
    # The suite is safe to run twice at once for FAMILIES (each run invents its own
    # `E2E-<runId>` and the orphan sweep spares anything younger than 2h), but the
    # T-39 billing seeds use FIXED external ids (`sub_e2e_*`) — two runs overlapping
    # there delete and recreate each other's rows. Queue instead of racing.
    concurrency:
      group: db-gate
      cancel-in-progress: false
    # Job level so the steps can read them in their own `if` — `secrets` is not
    # readable from an `if`, `env` is (the same shape `deploy-web` uses).
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_DEV }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
    steps:
      - uses: actions/checkout@v4

      # ── T-29, kept: the gate runs against the schema the PR is proposing ────
      # In the app repo this was a separate step before the suite; here it is a
      # step of the SAME job on purpose. Making it a job would mean the gate had
      # to `needs:` it, and a `needs:` on a job that skips (push, schedule) skips
      # the dependent too unless every edge is wrapped in `always()` — a footgun
      # for something whose only requirement is "before the suite, same runner".
      #
      # PULL REQUESTS ONLY: the PR is this repo's staging stage (there is no `dev`
      # branch — a merge to `main` publishes production). By the time a change is
      # on `main`, its PR already put the schema on dev.
      - name: Instalar Supabase CLI
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v3
        with:
          # PINNED, like the app repo: resolving "latest" spends GitHub API quota
          # and has failed runs on rate limit. Bump deliberately, never implicitly.
          version: 2.105.0

      - name: Aplicar migrations e functions no DEV (antes do gate)
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          source .github/functions.sh
          retry supabase link --project-ref "$PROJECT_REF"
          retry supabase db push
          deploy_functions "$PROJECT_REF"

      - name: Dizer por que o schema não foi aplicado
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "### Schema NÃO aplicado no dev — o gate rodou contra o schema antigo" >> "$GITHUB_STEP_SUMMARY"
          echo "Faltam \`SUPABASE_ACCESS_TOKEN_DEV\`, \`SUPABASE_DB_PASSWORD_DEV\` e \`SUPABASE_PROJECT_REF_DEV\` neste repo. Enquanto isso, quem aplica migrations é o \`entrelares-app\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: DB gate — regras de banco contra o projeto dev
        working-directory: db-gate/Entrelares.IntegrationTests
        env:
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
          # OPTIONAL: arms the positive billing-webhook tests. A missing secret
          # arrives empty, which the suite reads as absent and disarms those cases
          # — the same shape `deploy-web` gives the Cloudflare credentials. Set
          # `ASAAS_WEBHOOK_TOKEN_DEV` here to run them.
          E2E_ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN_DEV }}
        run: dotnet test -c Release --verbosity minimal

  # T-54's E2E lane (opened by lote 3, the first two-user flow). It drives the
  # REAL app on an emulator against the DEV project, with the throwaway-family
  # pattern the web suite already pays for (`E2E-<runId>`, `@resend.dev`,
  # `purge_e2e_family` — whose double-signature guard lives in the DATABASE, so
  # a fixture bug cannot delete a real family). NOT on every push: scheduled
  # daily + on demand, because an emulator run is minutes-expensive.
  e2e:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run-e2e)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # KVM must be writable for a hardware-accelerated emulator; without it
      # the run falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The service_role key never enters the repo: it arrives as a secret and
      # reaches the fixture through --dart-define only.
      - name: E2E — two-user swap flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/entrelares_app
          script: >-
            flutter test integration_test/swap_workflow_test.dart
            --flavor dev
            --dart-define=E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
            --dart-define=E2E_PACK=${{ inputs.e2e-pack || 'p0' }}

      # Lote 4 — the account/family pack. A separate emulator step rather than
      # one file with both, so a failure names which surface broke and the two
      # families never share a run id.
      - name: E2E — account and family flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/entrelares_app
          script: >-
            flutter test integration_test/account_flows_test.dart
            --flavor dev
            --dart-define=E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
            --dart-define=E2E_PACK=${{ inputs.e2e-pack || 'p0' }}

  apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build-apk
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Stage 3: flavors are mandatory. CI builds the DEV flavor only, and
      # DEBUG only: release signing reads the T-55 keystores from a local
      # key.properties (never in the repo nor in CI), so release builds are
      # local-by-construction — a release task here would fail fast on the
      # missing file.
      - name: Build debug APK (dev flavor, arm64)
        working-directory: apps/entrelares_app
        run: flutter build apk --debug --flavor dev --split-per-abi --target-platform android-arm64
      # 1-day retention: the 500 MB artifact quota is account-wide (T-50).
      # Glob: the flavor changes the APK filename (only one file matches).
      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-arm64-v8a-debug
          path: apps/entrelares_app/build/app/outputs/flutter-apk/app-*-debug.apk
          retention-days: 1

  # ── SPIKE (T-56, PR 5): the flow gate that survives the Blazor client ────
  # The Playwright suite (62 tests) dies with the UI it drives, and this repo's
  # emulator lane is 5 tests that run on a schedule. This job asks whether the
  # SAME `integration_test` files can run in a headless browser instead: no
  # emulator, so minutes-cheap enough for a push gate, and it exercises the web
  # channel — the one whose QA found six defects no Android run could have.
  #
  # On demand only while it is a spike. Promoting it to the gate is a separate
  # decision, and it needs this job's numbers first.
  web-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run-web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Same reasoning as `db-gate`: it drives the dev project, and the T-39
      # billing seeds use fixed ids.
      group: db-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      # The runner image ships Chrome and a matching chromedriver; using them
      # avoids adding a third-party action to the supply chain for a spike.
      - name: Locate Chrome and chromedriver
        run: |
          echo "chrome: $(google-chrome --version 2>/dev/null || echo AUSENTE)"
          echo "chromedriver: $(chromedriver --version 2>/dev/null || echo AUSENTE)"
          command -v chromedriver >/dev/null || { echo "::error::chromedriver não está no PATH do runner"; exit 1; }

      - name: Drive integration_test in a headless Chrome
        working-directory: apps/entrelares_app
        env:
          E2E_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_DEV }}
        run: |
          set -euo pipefail
          flutter pub get
          chromedriver --port=4444 &
          for i in $(seq 1 20); do curl -sf http://localhost:4444/status >/dev/null && break; sleep 1; done
          start=$(date +%s)
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/swap_workflow_test.dart \
            -d web-server --browser-name=chrome --headless \
            --dart-define=E2E_SUPABASE_SERVICE_ROLE_KEY="$E2E_KEY" \
            --dart-define=E2E_PACK=${{ inputs.e2e-pack || 'p0' }}
          echo "### Web E2E (spike) — ${SECONDS}s no passo, $(( $(date +%s) - start ))s no drive" >> "$GITHUB_STEP_SUMMARY"

  # ── Production database ──────────────────────────────────────────────────
  # T-29's order, preserved across the move: migrations → functions → app. This
  # job sits between the gates and `deploy-web`, so a failed `db push` stops the
  # publish and the environment is never left with a new app over an old schema.
  #
  # This is where this repo gained write access to the PRODUCTION database
  # (24/08/2026, owner decision — `docs/arquivamento-app.md`). It runs only from
  # `main`, only after BOTH gates are green, and the credentials are three secrets
  # that exist nowhere else in the workflow.
  db-prod:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [verify, db-gate]
    runs-on: ubuntu-latest
    env:
      # Account-scoped tokens; two named ones (ci-qa/ci-prod) give separate
      # revocation and audit per pipeline.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v3
        with:
          version: 2.105.0

      - name: Aplicar migrations e functions em PRODUÇÃO
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          source .github/functions.sh
          retry supabase link --project-ref "$PROJECT_REF"
          retry supabase db push
          deploy_functions "$PROJECT_REF"

      # Self-disarming until the owner moves the credentials, so `main` does not
      # go red for a piece of ops that has not happened yet. The note is loud on
      # purpose: while this step is the one that runs, schema and app do NOT
      # travel together, and the `entrelares-app` pipeline is still what applies
      # migrations to production.
      - name: Dizer por que o banco de produção não foi tocado
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "### Banco de PRODUÇÃO não tocado por este repo" >> "$GITHUB_STEP_SUMMARY"
          echo "Faltam \`SUPABASE_ACCESS_TOKEN_PROD\`, \`SUPABASE_DB_PASSWORD_PROD\` e \`SUPABASE_PROJECT_REF_PROD\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Enquanto isso quem aplica migrations em produção é o \`entrelares-app\`, e **schema e app não viajam juntos** — ver \`docs/arquivamento-app.md\`." >> "$GITHUB_STEP_SUMMARY"

  # ── T-53 stage 4 — the web channel ──────────────────────────────────────
  # Flutter Web REPLACES the Blazor PWA (tension 1), so this repo owns the
  # deploy of `web.entrelares.app`. Cloudflare Pages, the same platform and the
  # same account the Blazor app has always used, in its OWN project so the two
  # clients can be swapped by moving a custom domain — which is what keeps the
  # rollback of the cutover a dashboard action instead of a release.
  #
  # Three flags carry the whole cutover contract and none of them is optional:
  #   --dart-define=APP_ENV=prod  `flutter build web` accepts NO `--flavor`, so
  #                               without this the production hostname would be
  #                               built against the QA project (`web_channel_test`
  #                               fails the build if it disappears).
  #   --no-web-resources-cdn      CanvasKit from THIS origin: no gstatic request
  #                               on the first load, and a CSP that needs no
  #                               third-party host.
  #   --release                   the only build a user may ever receive.
  deploy-web:
    if: github.event_name == 'push' && github.ref_name == 'main'
    # Both gates, not one: since the DB gate moved here, publishing behind only the
    # Flutter suites would ship the web channel without the database rules ever
    # having been checked. And `db-prod` before it, which is T-29's order —
    # migrations → functions → app — so the channel never serves an app whose
    # schema failed to apply.
    needs: [verify, db-gate, db-prod]
    runs-on: ubuntu-latest
    # Job level on purpose: this is what the publish step reads in its own
    # `if`, and a step cannot reliably test the `env:` it declares itself.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Build web (production config)
        working-directory: apps/entrelares_app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --dart-define=APP_ENV=prod
      # Wrangler, as in the app repo. The Pages project name is IMMUTABLE once
      # created (a lesson the F-54 rebrand paid for), so it is pinned here and
      # created by the owner before the first run.
      - name: Install Wrangler
        run: npm install -g wrangler
      # Self-DISARMING while the Cloudflare credentials do not exist in this
      # repo — the same shape the app repo gives `E2E_ASAAS_WEBHOOK_TOKEN`: an
      # absent secret arrives empty and the step skips instead of painting
      # `main` red for a piece of ops that has not happened yet. The build
      # above still runs on every push, so the channel cannot rot silently.
      # (`secrets` is not readable from a job-level `if`; `env` is, from a
      # step-level one.)
      - name: Publish to Cloudflare Pages
        working-directory: apps/entrelares_app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: wrangler pages deploy build/web --project-name=entrelares-web --branch=main --commit-dirty=true
      - name: Say why nothing was published
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "### Canal web: build OK, publicação PULADA" >> "$GITHUB_STEP_SUMMARY"
          echo "Faltam os secrets \`CLOUDFLARE_API_TOKEN\` e \`CLOUDFLARE_ACCOUNT_ID\` neste repo (e o projeto Pages \`entrelares-web\`)." >> "$GITHUB_STEP_SUMMARY"

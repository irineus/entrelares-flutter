name: entrelares_db_contracts
description: PostgREST row contracts for Entrelares — the shape of every table the client and the database gate read, in pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  # The models compose the pure rules (entitlement, role catalog, audit diff);
  # nothing else. No Flutter, no Supabase SDK — that is what lets the database
  # gate depend on this package without dragging a UI toolkit into `dart test`.
  entrelares_core:
    path: ../entrelares_core

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
